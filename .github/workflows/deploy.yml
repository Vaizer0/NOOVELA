name: Deploy NoveLA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enable GitHub Pages from gh-pages branch
        run: |
          printf '{"source":{"branch":"gh-pages","path":"/"}}' > /tmp/pages.json
          echo "Pages payload:"
          cat /tmp/pages.json
          echo ""
          echo "Current Pages info:"
          gh api repos/${GITHUB_REPOSITORY}/pages 2>/dev/null || echo "(not yet configured)"
          echo "Sending POST to create Pages config..."
          gh api repos/${GITHUB_REPOSITORY}/pages \
            --method POST --input /tmp/pages.json 2>&1 || true
          echo "Sending PUT to update Pages config..."
          gh api repos/${GITHUB_REPOSITORY}/pages \
            --method PUT --input /tmp/pages.json 2>&1 || true
          echo "Done."

      - name: Build site snapshot
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude='.git' . /tmp/site/
          touch /tmp/site/.nojekyll

      - name: Validate snapshot
        run: |
          ERRORS=0
          for F in index.html manifest.json sw.js css/main.css css/reader.css \
                   js/i18n.js js/db.js js/settings.js js/scraper.js js/utils.js \
                   js/plugins.js js/tts.js js/translation.js js/backup.js \
                   js/epub.js js/reader.js js/manga.js js/library.js js/catalog.js \
                   js/search.js js/extensions.js js/migration.js js/minigames.js \
                   js/app.js; do
            if [ -f "/tmp/site/${F}" ]; then
              echo "  PASS  ${F} ($(wc -c < /tmp/site/${F}) bytes)"
            else
              echo "  FAIL  ${F} - MISSING"
              ERRORS=$((ERRORS+1))
            fi
          done
          echo "Validation: ${ERRORS} errors"
          if [ ${ERRORS} -gt 0 ]; then exit 1; fi
          echo "All files OK. Total JS: $(ls /tmp/site/js/*.js | wc -l)"

      - name: Deploy to gh-pages branch
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git checkout -b gh-pages origin/gh-pages
            echo "Using existing gh-pages branch"
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
            echo "Created new gh-pages branch"
          fi
          rsync -a --delete /tmp/site/ .
          git add -A
          git status --short | head -30
          if git diff --staged --quiet; then
            echo "No changes - gh-pages already up to date"
          else
            SHA=$(git rev-parse --short origin/main 2>/dev/null || date -u +%H%M%S)
            git commit -m "deploy: ${SHA}"
            git push origin gh-pages --force
            echo "Deployed to gh-pages!"
          fi

      - name: Show result
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          echo "Pages info after deploy:"
          gh api repos/${GITHUB_REPOSITORY}/pages 2>/dev/null | grep -E '(url|status|source)' || true
          echo "Site should be live at: https://${OWNER}.github.io/${REPO}/"
