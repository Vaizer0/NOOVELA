name: Deploy NoveLA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enable GitHub Pages from gh-pages branch
        run: |
          echo "Checking Pages status for ${GITHUB_REPOSITORY}..."
          STATUS=$(gh api repos/${GITHUB_REPOSITORY}/pages --jq '.source.branch' 2>/dev/null || echo "NOT_FOUND")
          echo "Current Pages source branch: ${STATUS}"
          if [ "${STATUS}" = "NOT_FOUND" ] || [ "${STATUS}" = "null" ] || [ -z "${STATUS}" ]; then
            echo "Enabling Pages from gh-pages branch..."
            gh api repos/${GITHUB_REPOSITORY}/pages \
              --method POST \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/" \
              2>&1 || echo "POST failed (may already exist, trying PUT)"
            gh api repos/${GITHUB_REPOSITORY}/pages \
              --method PUT \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/" \
              2>&1 || true
          else
            echo "Pages already configured. Ensuring source = gh-pages..."
            gh api repos/${GITHUB_REPOSITORY}/pages \
              --method PUT \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/" \
              2>&1 || true
          fi

      - name: Snapshot main into staging dir
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude='.git' . /tmp/site/
          touch /tmp/site/.nojekyll

      - name: Validate required files in snapshot
        run: |
          PASS=true
          for f in index.html manifest.json sw.js css/main.css css/reader.css \
                   js/app.js js/db.js js/library.js js/reader.js \
                   js/tts.js js/translation.js js/plugins.js; do
            if [ -f "/tmp/site/${f}" ]; then
              echo "  OK  ${f}"
            else
              echo "  MISSING: ${f}"
              PASS=false
            fi
          done
          JS_COUNT=$(ls /tmp/site/js/*.js 2>/dev/null | wc -l)
          echo "Total JS files: ${JS_COUNT}"
          if [ "${PASS}" = "false" ]; then
            echo "Validation failed!"
            exit 1
          fi
          echo "All required files present. index.html size: $(wc -c < /tmp/site/index.html) bytes"

      - name: Publish snapshot to gh-pages branch
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git checkout -b gh-pages origin/gh-pages
            echo "Checked out existing gh-pages branch"
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
            echo "Created new orphan gh-pages branch"
          fi
          rsync -a --delete /tmp/site/ .
          git add -A
          echo "Git status:"
          git status --short | head -20
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            SHORTSHA=$(git rev-parse --short origin/main 2>/dev/null || date -u +%Y%m%d%H%M)
            git commit -m "deploy: ${SHORTSHA}"
            git push origin gh-pages --force
            echo "Successfully deployed to gh-pages!"
          fi

      - name: Verify deployment
        run: |
          sleep 3
          INFO=$(gh api repos/${GITHUB_REPOSITORY}/pages 2>/dev/null || echo "{}")
          echo "Pages info: ${INFO}"
          OWNER_LC=$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          echo "============================="
          echo "Repo: https://github.com/${GITHUB_REPOSITORY}"
          echo "Live URL: https://${OWNER_LC}.github.io/${REPO_LC}/"
          echo "============================="
