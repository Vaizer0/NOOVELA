name: Deploy NoveLA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enable or update GitHub Pages (gh-pages branch source)
        run: |
          PAYLOAD='{"source":{"branch":"gh-pages","path":"/"}}'
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "Current Pages API response: HTTP $STATUS"
          if [ "$STATUS" = "404" ]; then
            echo "Pages not enabled yet. Creating now..."
            RESULT=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              -d "$PAYLOAD")
            echo "Create result: $RESULT"
          else
            echo "Pages exists. Ensuring source is gh-pages branch..."
            curl -s -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              -d "$PAYLOAD" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Snapshot main into /tmp/site
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude='.git' . /tmp/site/
          touch /tmp/site/.nojekyll
          echo "Files in snapshot:"
          ls /tmp/site

      - name: Publish snapshot to gh-pages branch
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git checkout -b gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi
          rsync -a --delete /tmp/site/ .
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            SHORTSHA=$(git rev-parse --short origin/main 2>/dev/null || date -u +%Y%m%d%H%M)
            git commit -m "deploy: ${SHORTSHA}"
            git push origin gh-pages --force
            echo "Successfully pushed to gh-pages"
          fi

      - name: Show live URL
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          echo "=============================="
          echo "Site URL: https://${OWNER}.github.io/${REPO}/"
          echo "=============================="
